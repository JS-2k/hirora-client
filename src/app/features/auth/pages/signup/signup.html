<main class="auth-shell auth-signup">
  <section class="auth-panel auth-panel-dark" aria-label="Hirora signup message">
    <a class="auth-brand" href="/" aria-label="Hirora home">
      <span>HIRORA</span>
      <i aria-hidden="true"></i>
    </a>

    <div class="auth-story">
      @if (accountType === 'candidate') {
      <h2>Practice. Improve. Land your first offer.</h2>
      <p>[ create your fresher account ]</p>
      } @else {
      <h2>Prepare your campus for placements.</h2>
      <p>[ create your college / institute account ]</p>
      }
    </div>
  </section>

  <section class="auth-panel auth-form-panel" aria-labelledby="signup-title">
    <div class="auth-form-wrap">
      <p class="auth-kicker">Sign up</p>
      <h1 id="signup-title">Create account</h1>

      <div class="account-tabs" role="group" aria-label="Account type">
        <button [class.is-active]="accountType === 'candidate'" type="button" (click)="setAccountType('candidate')">
          I'm a fresher
        </button>
        <button [class.is-active]="accountType === 'hiring'" type="button" (click)="setAccountType('hiring')">
          I'm from a college
        </button>
      </div>

      <form class="auth-form">
        <label>
          <span>Full name</span>
          <input type="text" autocomplete="name" placeholder="John Doe" />
        </label>

        <label>
          <span>Email</span>
          <input type="email" autocomplete="email" placeholder="you@email.com" />
        </label>

        <label>
          <span>Phone</span>
          <input type="tel" autocomplete="tel" placeholder="+91 98765 43210" />
        </label>

        <label>
          <span>Password</span>
          <input type="password" autocomplete="new-password" placeholder="Min. 8 characters" />
        </label>

        <button type="submit" formaction="/company">Create an account</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="/login">Sign in</a></p>
    </div>
  </section>
</main>
